<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SqliteWasmBlazor.Demo</title>
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
    <base href="/" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link href="_content/SqliteWasmBlazor.FloatingWindow/floating-window.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" crossorigin="anonymous" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js" crossorigin="anonymous"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js" crossorigin="anonymous"></script>
    <!-- Checked in as the Release form (registers the SW + wires the
         update-notification flow), so the deployable state is the default and a
         publish never ships without service-worker-update.js registered.
         DebugServiceWorker swaps this line back to a placeholder comment so the
         dev iteration loop isn't cached; ReleaseServiceWorker swaps it forward
         again. Both targets are in the csproj and each reverses the other, so
         either configuration normalizes the file before the build reads it.
         Registration is non-inline to satisfy the CSP script-src directive. -->
    <script src="service-worker-update.js"></script>
</body>

</html>
